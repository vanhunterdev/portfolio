<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Designer Portfolio | Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0c10;
      --panel: #131722;
      --panel-border: #232936;
      --text: #e2e8f0;
      --text-muted: #8492a6;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.3);
      --tag-bg: #1c2333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem 5rem;
      line-height: 1.5;
    }

    .container { max-width: 1180px; margin: 0 auto; }

    /* HUD / CHARACTER SHEET HEADER */
    .hud-header {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .hud-profile-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hud-title h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .hud-title .class-badge {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.2rem;
    }
    .hud-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
    }
    .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

    /* ПАРАМЕТРЫ ПЕРСОНАЖА (STATS COUNTERS) */
    .char-metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--panel-border);
    }
    .metric-card {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      text-align: center;
    }
    .metric-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .metric-unit {
      font-size: 0.8rem;
      color: var(--accent);
      margin-left: 0.25rem;
    }
    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.2rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* РАДАРЫ НАВЫКОВ (2 КОЛОНКИ) */
    .radars-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .radar-card {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .radar-card h4 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
      align-self: flex-start;
    }
    .radar-chart-box {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 330px;
  margin: 0 auto;
}

    /* ИНВЕНТАРЬ И АЧИВКИ В HUD */
    .hud-lower-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      font-size: 0.85rem;
      border-top: 1px solid var(--panel-border);
      padding-top: 1.25rem;
    }
    .hud-box h4 {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
    }
    .gear-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }
    .gear-item strong { color: #fff; }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.6rem;
    }
    .achievement-card {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .ach-icon { font-size: 1.25rem; }
    .ach-name { font-size: 0.8rem; font-weight: 600; color: #fff; line-height: 1.2; }
    .ach-desc { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .stat-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .stat-tag {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    /* SECTION TABS */
    .tabs-nav {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.75rem;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: var(--panel); }
    .tab-btn.active {
      color: #fff;
      background: var(--panel);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }
    .quest-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .quest-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .card-cover {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #000;
      border-bottom: 1px solid var(--panel-border);
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #fff;
    }
    .card-role {
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--panel-border);
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* MODAL CASE STUDY */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-window {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 14px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 40px var(--accent-glow);
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 1.25rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-hero-cover {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-bottom: 1px solid var(--panel-border);
    }
    .modal-content { padding: 1.75rem; }

    .btn-build-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--green);
      color: #042f2e;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 0 16px var(--green-glow);
      transition: all 0.2s ease;
      margin: 1rem 0 1.5rem;
    }
    .btn-build-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
      background: #34d399;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin: 1.5rem 0;
      border: 1px solid var(--panel-border);
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    .info-panels-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .stat-panel-card {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
    }
    .stat-panel-card h4 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .stat-panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.6rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }
    .stat-panel-grid div strong { color: var(--text-muted); font-weight: normal; }

    .quest-tasks {
      list-style: none;
      margin: 1rem 0 1.5rem;
    }
    .quest-tasks li {
      position: relative;
      padding-left: 1.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .quest-tasks li::before {
      content: '✔';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: bold;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }
    .gallery-item {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .gallery-item:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--panel-border);
    }
    .gallery-caption {
      padding: 0.6rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--panel-border);
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.9; }
    .action-btn.secondary {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
    }

    /* LIGHTBOX */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1.5rem;
      z-index: 2000;
      cursor: zoom-out;
    }
    .lightbox-backdrop.open { display: flex; }
    .lightbox-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }
    .lightbox-caption {
      margin-top: 1rem;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      max-width: 800px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- CHARACTER SHEET / HUD -->
    <header class="hud-header">
      <div class="hud-top">
        <div class="hud-profile-left">
          <div class="avatar-wrapper">
            <img id="hud-avatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?auto=format&fit=crop&w=200&q=80" alt="Avatar">
          </div>
          <div class="hud-title">
            <h1 id="hud-name">ИВАН ЧЕРНОВ</h1>
            <div class="class-badge" id="hud-class">&lt;Lead Game Designer & Mechanics Prototyper /&gt;</div>
          </div>
        </div>
        <div class="hud-status" id="hud-status-box">
          <span class="status-dot"></span>
          <span id="hud-status-text">READY TO QUEST</span>
        </div>
      </div>

      <!-- КЛЮЧЕВЫЕ МЕТРИКИ ПЕРСОНАЖА (УРОВЕНЬ, ОПЫТ, КОМАНДА) -->
      <div class="char-metrics-bar" id="char-metrics-bar">
        <!-- Сюда подставляются статы из profile -->
      </div>

      <!-- ДВЕ РАДАРНЫЕ ДИАГРАММЫ НАВЫКОВ -->
      <div class="radars-section">
        <div class="radar-card">
          <h4 style="color: #a5b4fc;">⚔️ Core Game Design</h4>
          <div class="radar-chart-box">

        </div>
        <div class="radar-card">
          <h4 style="color: #6ee7b7;">🛠️ Tech & Adjacent Skills</h4>

            <canvas id="techRadarChart"></canvas>

        </div>
      </div>

      <!-- НИЖНИЙ БЛОК: ИНВЕНТАРЬ, АЧИВКИ, СВЯЗЬ -->
      <div class="hud-lower-grid">
        <div class="hud-box">
          <h4>🎒 Инвентарь (Стек)</h4>
          <div class="gear-list" id="gear-list">

        <div class="hud-box">
          <h4>🏆 Разблокированные ачивки</h4>
          <div class="achievements-grid" id="achievements-grid">
            <!-- Сюда подгружаются ачивки -->
          </div>
        </div>

        <div class="hud-box">
          <h4>📡 Связь</h4>
          <div class="stat-tags">
            <a href="https://t.me/vanhunterdev" target="_blank" class="stat-tag" style="color: #60a5fa; text-decoration: none;">Резюме</a>
            <a href="https://t.me/vanhunterdev" target="_blank" class="stat-tag" style="color: #60a5fa; text-decoration: none;">Telegram</a>
            <a href="https://t.me/chernovveek" target="_blank" class="stat-tag" style="color: #e2e8f0; text-decoration: none;">Мой паблик</a>
            <a href="https://docs.google.com/document/d/1D96hir2yjrn7_5aY5U4vhFEA2n2Z-cvqQ7u0khV7yF8/edit?tab=t.0#heading=h.ntiiiaqr157z" target="_blank" class="stat-tag" style="color: #e2e8f0; text-decoration: none;">Itch.io</a>
          </div>
        </div>
      </div>
    </header>

    <!-- ВКЛАДКИ РАЗДЕЛОВ -->
    <nav class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('all')">Все квесты</button>
      <button class="tab-btn" onclick="switchTab('commercial')">💼 Коммерческие проекты</button>
      <button class="tab-btn" onclick="switchTab('indie')">🧪 Личные</button>
      <button class="tab-btn" onclick="switchTab('prototype')">⚡Прототипы</button>
    </nav>

    <!-- СЕТКА КАРТОЧЕК -->
    <main class="cards-grid" id="cards-container">
      <p style="color: var(--text-muted); font-family: 'JetBrains Mono';">Загрузка данных из инвентаря...</p>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЬНОГО РАЗБОРА КЕЙСА -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
    <div class="modal-window" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ПОЛНОЭКРАННЫЙ ПРОСМОТР СКРИНШОТА (LIGHTBOX) -->
  <div class="lightbox-backdrop" id="lightbox-backdrop" onclick="closeLightbox()">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Fullscreen Screenshot">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <!-- БИБЛИОТЕКИ: PapaParse для CSV и Chart.js для радаров -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // 1. ССЫЛКА НА ЛИСТ ПРОЕКТОВ (Лист 1):
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMLFxwVYRo4tJpLB8qyh98e8VBRSumEXo1l7BCpueaMKa28s0wnJbbzGnImdFUyyo_9WW9htUhDA_W/pub?gid=0&single=true&output=csv';

    // 2. ССЫЛКА НА ЛИСТ ПРОФИЛЯ / SKILLS (Лист 2):
    // Вставьте сюда опубликованную ссылку на лист "profile" (с gid=...):
    const PROFILE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMLFxwVYRo4tJpLB8qyh98e8VBRSumEXo1l7BCpueaMKa28s0wnJbbzGnImdFUyyo_9WW9htUhDA_W/pub?gid=1095759329&single=true&output=tsv';

    let allProjects = [];
    let currentFilter = 'all';

    function getYouTubeId(urlOrId) {
      if (!urlOrId) return '';
      const match = urlOrId.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : urlOrId.trim();
    }

    async function init() {
      // 1. Загрузка проектов
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allProjects = results.data.sort((a, b) => (parseInt(a.order) || 99) - (parseInt(b.order) || 99));
          renderCards();
        },
        error: function() {
          document.getElementById('cards-container').innerHTML = 
            '<p style="color: #ef4444; font-family: monospace;">Ошибка загрузки Google Таблицы. Проверьте ссылку публикации CSV.</p>';
        }
      });

      // 2. Загрузка профиля и радаров
      if (PROFILE_CSV_URL) {
        Papa.parse(PROFILE_CSV_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            applyProfileData(results.data);
          }
        });
      } else {
        // Дефолтные радары и статы, если ссылка еще не вставлена
        renderDefaultProfile();
      }
    }

    function applyProfileData(rows) {
      const stats = [];
      const skillsGd = [];
      const skillsTech = [];
      const gear = [];
      const achs = [];

      rows.forEach(r => {
        const type = (r.type || '').trim().toLowerCase();
        if (type === 'meta') {
          if (r.name === 'avatar' && r.value) document.getElementById('hud-avatar').src = r.value;
          if (r.name === 'name' && r.value) document.getElementById('hud-name').textContent = r.value;
          if (r.name === 'class_title' && r.value) document.getElementById('hud-class').textContent = `<${r.value} />`;
          if (r.name === 'status' && r.value) document.getElementById('hud-status-text').textContent = r.value;
        } else if (type === 'stat') {
          stats.push(r);
        } else if (type === 'skill_gd') {
          skillsGd.push({ name: r.name, val: parseInt(r.value) || 50, desc: r.desc });
        } else if (type === 'skill_tech') {
          skillsTech.push({ name: r.name, val: parseInt(r.value) || 50, desc: r.desc });
        } else if (type === 'gear') {
          gear.push(r);
        } else if (type === 'achievement') {
          achs.push(r);
        }
      });

      // Отрисовка метрик
      if (stats.length > 0) {
        const metricsContainer = document.getElementById('char-metrics-bar');
        metricsContainer.innerHTML = stats.map(s => `
          <div class="metric-card">
            <div class="metric-val">${s.value}<span class="metric-unit">${s.extra || ''}</span></div>
            <div class="metric-label">${s.name}</div>
          </div>
        `).join('');
      }

      // Отрисовка инвентаря
      if (gear.length > 0) {
        document.getElementById('gear-list').innerHTML = gear.map(g => `
          <div class="gear-item">${g.extra ? g.extra + ' ' : ''}<strong>${g.name}:</strong> <span style="color: var(--text-muted);">${g.value}</span></div>
        `).join('');
      }

      // Отрисовка ачивок
      if (achs.length > 0) {
        document.getElementById('achievements-grid').innerHTML = achs.map(a => `
          <div class="achievement-card">
            <span class="ach-icon">${a.extra || '🏆'}</span>
            <div>
              <div class="ach-name">${a.name}</div>
              <div class="ach-desc">${a.value || ''}</div>
            </div>
          </div>
        `).join('');
      }

      // Инициализация радаров
      createRadarChart('gdRadarChart', skillsGd, 'rgba(99, 102, 241, 0.4)', '#818cf8');
      createRadarChart('techRadarChart', skillsTech, 'rgba(16, 185, 129, 0.4)', '#34d399');
    }

    function renderDefaultProfile() {
      const defaultGd = [
        { name: 'Системный дизайн', val: 90 },
        { name: 'Боевые системы', val: 95 },
        { name: 'Баланс & Математика', val: 85 },
        { name: 'Левел-дизайн', val: 80 },
        { name: 'Нарратив', val: 75 }
      ];
      const defaultTech = [
        { name: 'Прототипирование C#', val: 90 },
        { name: 'UI / UX Дизайн', val: 80 },
        { name: 'Тех. арт & Spine', val: 75 },
        { name: 'Архитектура', val: 85 },
        { name: 'Продакшен & ТЗ', val: 85 }
      ];
      
      document.getElementById('char-metrics-bar').innerHTML = `
        <div class="metric-card"><div class="metric-val">28<span class="metric-unit">lvl</span></div><div class="metric-label">Возраст</div></div>
        <div class="metric-card"><div class="metric-val">8+<span class="metric-unit">лет</span></div><div class="metric-label">Опыт в GD</div></div>
        <div class="metric-card"><div class="metric-val">20+<span class="metric-unit">билдов</span></div><div class="metric-label">Прототипы</div></div>
        <div class="metric-card"><div class="metric-val">12+<span class="metric-unit">чел</span></div><div class="metric-label">Команды</div></div>
      `;

      document.getElementById('gear-list').innerHTML = `
        <div class="gear-item">🎮 <strong>Движки:</strong> <span style="color: var(--text-muted);">Unity, Godot Engine, Cocos Creator</span></div>
        <div class="gear-item">💻 <strong>Код & Логика:</strong> <span style="color: var(--text-muted);">C#, GDScript, TypeScript, Git</span></div>
        <div class="gear-item">📜 <strong>Дизайн & Документы:</strong> <span style="color: var(--text-muted);">Miro, Notion, Figma</span></div>
      `;

      document.getElementById('achievements-grid').innerHTML = `
        <div class="achievement-card"><span class="ach-icon">🏆</span><div><div class="ach-name">Shipped Title</div><div class="ach-desc">Steam / PC Release</div></div></div>
        <div class="achievement-card"><span class="ach-icon">👥</span><div><div class="ach-name">Guild Leader</div><div class="ach-desc">12+ Devs Team</div></div></div>
        <div class="achievement-card"><span class="ach-icon">🎓</span><div><div class="ach-name">Sensei</div><div class="ach-desc">5+ Years Teaching</div></div></div>
      `;

      createRadarChart('gdRadarChart', defaultGd, 'rgba(99, 102, 241, 0.4)', '#818cf8');
      createRadarChart('techRadarChart', defaultTech, 'rgba(16, 185, 129, 0.4)', '#34d399');
    }

    function createRadarChart(canvasId, items, fillColor, borderColor) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      
      // Авто-перенос длинных фраз на 2 строки
      const formattedLabels = items.map(i => {
        const text = i.name;
        if (text.includes(' & ')) {
          const parts = text.split(' & ');
          return [parts[0], '& ' + parts[1]];
        }
        if (text.length > 14 && text.includes(' ')) {
          const words = text.split(' ');
          const mid = Math.ceil(words.length / 2);
          return [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
        }
        return text;
      });

      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: formattedLabels,
          datasets: [{
            data: items.map(i => Number(i.val) || 0),
            backgroundColor: fillColor,
            borderColor: borderColor,
            borderWidth: 2,
            pointBackgroundColor: borderColor,
            pointBorderColor: '#fff',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: 15
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: function(context) {
                  const idx = context[0].dataIndex;
                  return items[idx].name;
                },
                label: function(context) {
                  return ` Уровень: ${context.raw} / 100`;
                }
              }
            }
          },
          scales: {
            r: {
              min: 0,             // КРИТИЧНО: фиксируем строгий ноль шкалы
              max: 100,           // КРИТИЧНО: максимум 100%
              beginAtZero: true,  // Запрещаем Chart.js сплющивать центр
              angleLines: { 
                color: 'rgba(255, 255, 255, 0.12)' 
              },
              grid: { 
                color: 'rgba(255, 255, 255, 0.08)' 
              },
              pointLabels: {
                color: '#94a3b8',
                font: { 
                  family: 'JetBrains Mono', 
                  size: 11,
                  weight: 500
                },
                padding: 10
              },
              ticks: { 
                display: false,   // Скрываем цифры делений, чтобы не шуметь
                stepSize: 20      // Шаг колец паутины (20, 40, 60, 80, 100)
              }
            }
          }
        }
      });
    }

    function switchTab(section) {
      currentFilter = section;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const filtered = currentFilter === 'all' 
        ? allProjects 
        : allProjects.filter(p => (p.section || '').trim().toLowerCase() === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-family: monospace;">В этом разделе пока нет записей.</p>';
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'quest-card';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <img class="card-cover" src="${item.cover_url || ''}" alt="${item.title}" onerror="this.style.display='none'">
          <div class="card-body">
            <div class="card-meta">
              <span>${item.engine || 'Engine'}</span>
              <span>${item.year ? item.year : ''}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <div class="card-role">${item.my_role || ''}</div>
            <p class="card-desc">${item.desc || item.short_desc || ''}</p>
            <div class="card-footer">
              <span style="color: var(--text-muted);">${item.status || ''}</span>
              <span style="color: var(--accent);">Осмотреть квест →</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(item) {
      const modal = document.getElementById('modal-backdrop');
      const body = document.getElementById('modal-body');

      const tasksList = item.my_tasks 
        ? item.my_tasks.split(';').map(t => t.trim()).filter(Boolean).map(t => `<li>${t}</li>`).join('')
        : '';

      let screenshotsHtml = '';
      if (item.screenshots) {
        const rawScreens = item.screenshots.includes(';') ? item.screenshots.split(';') : item.screenshots.split(',');
        screenshotsHtml = rawScreens.map(entry => {
          const parts = entry.split('|').map(p => p.trim());
          const url = parts[0];
          const caption = parts[1] || 'Нажмите для увеличения';
          if (!url) return '';
          return `
            <div class="gallery-item" onclick="openLightbox('${url}', '${caption.replace(/'/g, "\\'")}')">
              <img src="${url}" alt="Скриншот">
              <div class="gallery-caption">${caption}</div>
            </div>
          `;
        }).join('');
      }

      const cleanYtId = getYouTubeId(item.youtube_id);

      body.innerHTML = `
        ${item.cover_url ? `<img class="modal-hero-cover" src="${item.cover_url}" alt="Cover">` : ''}
        
        <div class="modal-content">
          <div style="font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.85rem; margin-bottom: 0.3rem;">
            [${(item.section || 'QUEST').toUpperCase()}] // ${item.engine || ''} ${item.year ? `// ${item.year}` : ''}
          </div>
          <h2 style="font-size: 1.6rem; color: #fff; margin-bottom: 0.5rem;">${item.title}</h2>
          <div style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.25rem;">${item.desc || ''}</div>

          <!-- КНОПКА СЫГРАТЬ В БИЛД СРАЗУ ПОСЛЕ ОПИСАНИЯ -->
          ${item.build_url ? `
            <a href="${item.build_url}" target="_blank" class="btn-build-primary">
              🎮 Сыграть в билд
            </a>
          ` : ''}

          <!-- 1. ВИДЕО YOUTUBE -->
          ${cleanYtId ? `
            <div class="video-container">
              <iframe src="https://www.youtube.com/embed/${cleanYtId}?rel=0" allowfullscreen></iframe>
            </div>
          ` : ''}

          <!-- 2. РАЗДЕЛЕННЫЕ ПЛАШКИ ХАРАКТЕРИСТИК -->
          <div class="info-panels-group">
            <!-- О ПРОЕКТЕ -->
            <div class="stat-panel-card">
              <h4>📦 О проекте</h4>
              <div class="stat-panel-grid">
                <div><strong>Платформа:</strong> ${item.platform || 'PC'}</div>
                <div><strong>Команда:</strong> ${item.team_composition || item.team_type || 'Solo'}</div>
                <div><strong>Движок:</strong> ${item.engine || '-'}</div>
                <div><strong>Жанр:</strong> ${item.genre || '-'}</div>
                <div><strong>Год:</strong> ${item.year || '-'}</div>
                <div><strong>Статус:</strong> ${item.status || '-'}</div>
                ${item.tools_tags || item.tags ? `<div><strong>Теги проекта:</strong> ${item.tools_tags || item.tags}</div>` : ''}
              </div>
            </div>

            <!-- О МОЕЙ РОЛИ -->
            <div class="stat-panel-card">
              <h4>👤 О моей роли</h4>
              <div class="stat-panel-grid">
                <div><strong>Моя роль:</strong> ${item.my_role || 'Game Designer'}</div>
                <div><strong>Мои инструменты:</strong> ${item.tools || '-'}</div>
              </div>
            </div>
          </div>

          <!-- 3. ВЫПОЛНЕННЫЕ ЗАДАЧИ -->
          ${tasksList ? `
            <h4 style="font-family: 'JetBrains Mono'; margin-top: 1.5rem; color: #fff;">📜 Задачи на проекте:</h4>
            <ul class="quest-tasks">${tasksList}</ul>
          ` : ''}

          <!-- 4. ТЕХНИЧЕСКИЙ РАЗБОР / АРХИТЕКТУРА -->
          ${item.tech_desc ? `
            <h4 style="font-family: 'JetBrains Mono'; margin-top: 1.5rem; color: #fff;">⚙️ Дополнительное описание:</h4>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.4rem; line-height: 1.6;">${item.tech_desc}</p>
          ` : ''}

          <!-- 5. СКРИНШОТЫ С ПОДПИСЯМИ -->
          ${screenshotsHtml ? `
            <h4 style="font-family: 'JetBrains Mono'; margin-top: 1.75rem; color: #fff;">🖼️ Скриншоты:</h4>
            <div class="gallery-grid">${screenshotsHtml}</div>
          ` : ''}

          <!-- 6. ДОПОЛНИТЕЛЬНЫЕ КНОПКИ ДЕЙСТВИЙ -->
          <div class="modal-actions">
            ${item.build_url ? `<a href="${item.build_url}" target="_blank" class="action-btn" style="background: var(--green); color: #042f2e;">🎮 Сыграть в билд</a>` : ''}
            ${item.doc_url ? `<a href="${item.doc_url}" target="_blank" class="action-btn secondary">📜 Дизайн-документ (GDD)</a>` : ''}
            ${item.repo_url ? `<a href="${item.repo_url}" target="_blank" class="action-btn secondary">💻 Исходный код</a>` : ''}
          </div>
        </div>
      `;

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
      if (!event || event.target.id === 'modal-backdrop' || event.target.classList.contains('modal-close-btn')) {
        document.getElementById('modal-backdrop').classList.remove('open');
        document.body.style.overflow = '';
      }
    }

    function openLightbox(url, caption) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-caption').textContent = (caption && caption !== 'Нажмите для увеличения') ? caption : '';
      document.getElementById('lightbox-backdrop').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox-backdrop').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('lightbox-backdrop').classList.contains('open')) {
          closeLightbox();
        } else {
          closeModal();
        }
      }
    });

    init();
  </script>
</body>
</html>
