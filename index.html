<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Designer Portfolio | Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0c10;
      --panel: #131722;
      --panel-border: #232936;
      --text: #e2e8f0;
      --text-muted: #8492a6;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.3);
      --tag-bg: #1c2333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem 5rem;
      line-height: 1.5;
    }

    .container { max-width: 1180px; margin: 0 auto; }

    /* HUD / CHARACTER SHEET HEADER */
    .hud-header {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 2.5rem;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .hud-title h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
    }
    .hud-title .class-badge {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .hud-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
    }
    .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

    .hud-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      font-size: 0.85rem;
    }
    .stat-box h4 {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .stat-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .stat-tag {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    /* SECTION TABS */
    .tabs-nav {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.75rem;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: var(--panel); }
    .tab-btn.active {
      color: #fff;
      background: var(--panel);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }
    .quest-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .quest-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .card-cover {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #000;
      border-bottom: 1px solid var(--panel-border);
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: #fff;
    }
    .card-role {
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--panel-border);
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* MODAL CASE STUDY */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-window {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 14px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 40px var(--accent-glow);
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 1.25rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-hero-cover {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-bottom: 1px solid var(--panel-border);
    }
    .modal-content { padding: 1.75rem; }

    /* ЗЕЛЕНАЯ КНОПКА БИЛДА (АКЦЕНТНАЯ) */
    .btn-build-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--green);
      color: #042f2e;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 0 16px var(--green-glow);
      transition: all 0.2s ease;
      margin: 1rem 0 1.5rem;
    }
    .btn-build-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
      background: #34d399;
    }

    /* ВИДЕО YOUTUBE */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin: 1.5rem 0;
      border: 1px solid var(--panel-border);
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    /* РАЗДЕЛЕННЫЕ ПЛАШКИ ХАРАКТЕРИСТИК */
    .info-panels-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .stat-panel-card {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
    }
    .stat-panel-card h4 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .stat-panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.6rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }
    .stat-panel-grid div strong { color: var(--text-muted); font-weight: normal; }

    .quest-tasks {
      list-style: none;
      margin: 1rem 0 1.5rem;
    }
    .quest-tasks li {
      position: relative;
      padding-left: 1.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .quest-tasks li::before {
      content: '✔';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: bold;
    }

    /* ГАЛЕРЕЯ СКРИНШОТОВ С ПОДПИСЯМИ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }
    .gallery-item {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .gallery-item:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--panel-border);
    }
    .gallery-caption {
      padding: 0.6rem 0.75rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--panel-border);
    }
    .action-btn {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.9; }
    .action-btn.secondary {
      background: var(--tag-bg);
      border: 1px solid var(--panel-border);
    }

    /* ПОЛНОЭКРАННЫЙ ПРОСМОТРЩИК СКРИНШОТА (LIGHTBOX) */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1.5rem;
      z-index: 2000;
      cursor: zoom-out;
    }
    .lightbox-backdrop.open { display: flex; }
    .lightbox-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }
    .lightbox-caption {
      margin-top: 1rem;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      max-width: 800px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- CHARACTER SHEET / HUD -->
    <header class="hud-header">
      <div class="hud-top">
        <div class="hud-title">
          <h1>ИВАН ЧЕРНОВ</h1>
          <div class="class-badge">&lt;Lead Game Designer & Mechanics Prototyper /&gt;</div>
        </div>
        <div class="hud-status">
          <span class="status-dot"></span>
          <span>READY TO QUEST</span>
        </div>
      </div>

      <div class="hud-stats-grid">
        <div class="stat-box">
          <h4>⚔️ Специализация</h4>
          <div class="stat-tags">
            <span class="stat-tag">Combat Design</span>
            <span class="stat-tag">System Design</span>
            <span class="stat-tag">Mechanics Prototyping</span>
          </div>
        </div>
        <div class="stat-box">
          <h4>🛠️ Инвентарь (Стек)</h4>
          <div class="stat-tags">
            <span class="stat-tag">Unity (C#)</span>
            <span class="stat-tag">Godot</span>
            <span class="stat-tag">Cocos Creator</span>
            <span class="stat-tag">Git</span>
          </div>
        </div>
        <div class="stat-box">
          <h4>📡 Связь</h4>
          <div class="stat-tags">
            <a href="https://t.me/chernovveek" target="_blank" class="stat-tag" style="color: #60a5fa; text-decoration: none;">Telegram</a>
            <a href="mailto:your@email.com" class="stat-tag" style="color: #e2e8f0; text-decoration: none;">Email</a>
          </div>
        </div>
      </div>
    </header>

    <!-- ВКЛАДКИ РАЗДЕЛОВ -->
    <nav class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('all')">Все квесты</button>
      <button class="tab-btn" onclick="switchTab('commercial')">💼 Коммерческие проекты</button>
      <button class="tab-btn" onclick="switchTab('indie')">🧪 Личные / Инди</button>
      <button class="tab-btn" onclick="switchTab('prototype')">⚡ R&D и Прототипы</button>
    </nav>

    <!-- СЕТКА КАРТОЧЕК -->
    <main class="cards-grid" id="cards-container">
      <p style="color: var(--text-muted); font-family: 'JetBrains Mono';">Загрузка данных из инвентаря...</p>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЬНОГО РАЗБОРА КЕЙСА -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
    <div class="modal-window" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ПОЛНОЭКРАННЫЙ ПРОСМОТР СКРИНШОТА (LIGHTBOX) -->
  <div class="lightbox-backdrop" id="lightbox-backdrop" onclick="closeLightbox()">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Fullscreen Screenshot">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <!-- PapaParse для чтения CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMLFxwVYRo4tJpLB8qyh98e8VBRSumEXo1l7BCpueaMKa28s0wnJbbzGnImdFUyyo_9WW9htUhDA_W/pub?gid=0&single=true&output=csv';

    let allProjects = [];
    let currentFilter = 'all';

    function getYouTubeId(urlOrId) {
      if (!urlOrId) return '';
      const match = urlOrId.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : urlOrId.trim();
    }

    async function init() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allProjects = results.data.sort((a, b) => (parseInt(a.order) || 99) - (parseInt(b.order) || 99));
          renderCards();
        },
        error: function() {
          document.getElementById('cards-container').innerHTML = 
            '<p style="color: #ef4444; font-family: monospace;">Ошибка загрузки Google Таблицы. Проверьте ссылку публикации CSV.</p>';
        }
      });
    }

    function switchTab(section) {
      currentFilter = section;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const filtered = currentFilter === 'all' 
        ? allProjects 
        : allProjects.filter(p => (p.section || '').trim().toLowerCase() === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-family: monospace;">В этом разделе пока нет записей.</p>';
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'quest-card';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <img class="card-cover" src="${item.cover_url || ''}" alt="${item.title}" onerror="this.style.display='none'">
          <div class="card-body">
            <div class="card-meta">
              <span>${item.engine || 'Engine'}</span>
              <span>${item.year ? item.year : ''}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <div class="card-role">${item.my_role || ''}</div>
            <p class="card-desc">${item.desc || item.short_desc || ''}</p>
            <div class="card-footer">
              <span style="color: var(--text-muted);">${item.status || ''}</span>
              <span style="color: var(--accent);">Осмотреть квест →</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(item) {
      const modal = document.getElementById('modal-backdrop');
      const body = document.getElementById('modal-body');

      const tasksList = item.my_tasks 
        ? item.my_tasks.split(';').map(t => t.trim()).filter(Boolean).map(t => `<li>${t}</li>`).join('')
        : '';

      // Парсинг скриншотов с возможными подписями: "img/1.png | Описание; img/2.png | Описание"
      let screenshotsHtml = '';
      if (item.screenshots) {
        const rawScreens = item.screenshots.includes(';') ? item.screenshots.split(';') : item.screenshots.split(',');
        screenshotsHtml = rawScreens.map(entry => {
          const parts = entry.split('|').map(p => p.trim());
          const url = parts[0];
          const caption = parts[1] || 'Нажмите для увеличения';
          if (!url) return '';
          return `
            <div class="gallery-item" onclick="openLightbox('${url}', '${caption.replace(/'/g, "\\'")}')">
              <img src="${url}" alt="Скриншот">
              <div class="gallery-caption">${caption}</div>
            </div>
          `;
        }).join('');
      }

      const cleanYtId = getYouTubeId(item.youtube_id);

      body.innerHTML = `
        ${item.cover_url ? `<img class="modal-hero-cover" src="${item.cover_url}" alt="Cover">` : ''}
        
        <div class="modal-content">
          <div style="font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 0.85rem; margin-bottom: 0.3rem;">
            [${(item.section || 'QUEST').toUpperCase()}] // ${item.engine || ''} ${item.year ? `// ${item.year}` : ''}
          </div>
          <h2 style="font-size: 1.6rem; color: #fff; margin-bottom: 0.5rem;">${item.title}</h2>
          <div style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.25rem;">${item.desc || ''}</div>

          <!-- КНОПКА СЫГРАТЬ В БИЛД СРАЗУ ПОСЛЕ ОПИСАНИЯ -->
          ${item.build_url ? `
            <a href="${item.build_url}" target="_blank" class="btn-build-primary">
              🎮 Сыграть в билд
            </a>
          ` : ''}

          <!-- 1. ВИДЕО YOUTUBE -->
          ${cleanYtId ? `
            <div class="video-container">
              <iframe src="https://www.youtube.com/embed/${cleanYtId}?rel=0" allowfullscreen></iframe>
            </div>
          ` : ''}

          <!-- 2. РАЗДЕЛЕННЫЕ ПЛАШКИ ХАРАКТЕРИСТИК -->
          <div class="info-panels-group">
            <!-- О ПРОЕКТЕ -->
            <div class="stat-panel-card">
              <h4>📦 О проекте</h4>
              <div class="stat-panel-grid">
                <div><strong>Платформа:</strong> ${item.platform || 'PC'}</div>
                <div><strong>Команда:</strong> ${item.team_composition || item.team_type || 'Solo'}</div>
                <div><strong>Движок:</strong> ${item.engine || '-'}</div>
                <div><strong>Жанр:</strong> ${item.genre || '-'}</div>
                <div><strong>Год:</strong> ${item.year || '-'}</div>
                <div><strong>Статус:</strong> ${item.status || '-'}</div>
                ${item.tools_tags || item.tags ? `<div><strong>Теги проекта:</strong> ${item.tools_tags || item.tags}</div>` : ''}
              </div>
            </div>

            <!-- О МОЕЙ РОЛИ -->
            <div class="stat-panel-card">
              <h4>👤 О моей роли</h4>
              <div class="stat-panel-grid">
                <div><strong>Моя роль:</strong> ${item.my_role || 'Game Designer'}</div>
                <div><strong>Мои инструменты:</strong> ${item.tools || '-'}</div>
              </div>
            </div>
          </div>

          <!-- 3. ВЫПОЛНЕННЫЕ ЗАДАЧИ -->
          ${tasksList ? `
            <h4 style="font-family: 'JetBrains Mono'; margin-top: 1.5rem; color: #fff;">📜 Выполненные задачи:</h4>
            <ul class="quest-tasks">${tasksList}</ul>
          ` : ''}

          <!-- 4. ТЕХНИЧЕСКИЙ РАЗБОР / АРХИТЕКТУРА -->
          ${item.tech_desc ? `
            <h4 style="font-family: 'JetBrains Mono'; margin-top: 1.5rem; color: #fff;">⚙️ Архитектура и реализация:</h4>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.4rem; line-height: 1.6;">${item.tech_desc}</p>
          ` : ''}

          <!-- 5. СКРИНШОТЫ С ПОДПИСЯМИ -->
          ${screenshotsHtml ? `
            <h4 style="font-family: 'JetBrains Mono'; margin-top: 1.75rem; color: #fff;">🖼️ Скриншоты и схемы:</h4>
            <div class="gallery-grid">${screenshotsHtml}</div>
          ` : ''}

          <!-- 6. ДОПОЛНИТЕЛЬНЫЕ КНОПКИ ДЕЙСТВИЙ -->
          <div class="modal-actions">
            ${item.build_url ? `<a href="${item.build_url}" target="_blank" class="action-btn" style="background: var(--green); color: #042f2e;">🎮 Сыграть в билд</a>` : ''}
            ${item.doc_url ? `<a href="${item.doc_url}" target="_blank" class="action-btn secondary">📜 Дизайн-документ (GDD)</a>` : ''}
            ${item.repo_url ? `<a href="${item.repo_url}" target="_blank" class="action-btn secondary">💻 Исходный код</a>` : ''}
          </div>
        </div>
      `;

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
      if (!event || event.target.id === 'modal-backdrop' || event.target.classList.contains('modal-close-btn')) {
        document.getElementById('modal-backdrop').classList.remove('open');
        document.body.style.overflow = '';
      }
    }

    /* ЛОГИКА ПОЛНОЭКРАННОГО СКРИНШОТА (LIGHTBOX) */
    function openLightbox(url, caption) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-caption').textContent = (caption && caption !== 'Нажмите для увеличения') ? caption : '';
      document.getElementById('lightbox-backdrop').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox-backdrop').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('lightbox-backdrop').classList.contains('open')) {
          closeLightbox();
        } else {
          closeModal();
        }
      }
    });

    init();
  </script>
</body>
</html>
